// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
        classpath 'com.google.gms:google-services:4.5.0'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Google Play now requires apps to target API 36 (Android 16). Expo SDK 53's
// default is API 35, so override it here before expo-root-project sets its
// fallback — see node_modules/expo-modules-autolinking's ExpoRootProjectPlugin,
// which only applies its default when these ext values aren't already set.
ext {
  buildToolsVersion = "36.0.0"
  compileSdkVersion = 36
  targetSdkVersion = 36
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
